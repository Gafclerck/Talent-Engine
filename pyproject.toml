[project]
name = "talent-engine"
version = "0.1.0"
description = "Talent Engine - import et classement de candidatures"
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.143.0",
    "sqlalchemy==2.1.4",
    "pydantic==2.14.0",
    "jinja2==3.1.6",
    "uvicorn==0.54.0",
    "python-multipart==0.0.32",
    "openpyxl==3.1.5",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "httpx2==2.13.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
